<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Pet da Pri | Banho e Tosa em Camaquã/RS</title>
    <meta name="description" content="Fale com a Pet da Pri: telefone, WhatsApp, e-mail, endereço e horário de funcionamento em Camaquã/RS.">

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <meta name="theme-color" content="#17a2b8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>

    <header id="cabecalho"></header>

    <main id="conteudo-principal" class="container py-4">
        <h1>Fale Conosco</h1>
        <p>Ficou com alguma dúvida? Entre em contato pelos canais abaixo:</p>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Canais de atendimento</h2>
                        <!-- Preenchido a partir de SITE_CONFIG.contato -->
                        <ul id="contato-canais" class="list-unstyled mb-0"></ul>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title">Horário de Funcionamento</h2>
                        <table class="table table-sm mb-0">
                            <caption class="visually-hidden">Horário de funcionamento</caption>
                            <!-- Preenchido a partir de SITE_CONFIG.horarios -->
                            <tbody id="contato-horario"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <section class="mt-4" aria-labelledby="titulo-como-chegar">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 card-title" id="titulo-como-chegar">Como chegar</h2>
                    <!-- Mapa + botões do Waze e Google Maps, montados por js/main.js -->
                    <div id="contato-mapa"></div>
                </div>
            </div>
        </section>

        <div class="mt-4 text-center">
            <a href="agendamento.html" class="btn btn-destaque">Já quer agendar um horário? Clique aqui</a>
        </div>
    </main>

    <footer id="rodape"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
